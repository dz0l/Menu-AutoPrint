{% extends "base.html" %}
{% load static %}
{% block title %}Формирование меню{% endblock %}
{% block content %}
<section class="toolbar">
  <label>Дата
    <input id="printDate" type="date">
  </label>
  <label class="inline"><input id="showKcal" type="checkbox" checked> kcal/gr</label>
  <button id="btnPreview" class="primary" type="button">Предпросмотр</button>
  <button id="btnPdf" type="button">PDF</button>
  <button id="btnMissing" type="button" disabled>Добавить в базу</button>
  <button id="btnFix" type="button" disabled>Исправить граммовки</button>
</section>

<section class="grid-two">
  <div class="panel">
    <h1>Меню RU</h1>
    <textarea id="ruText" placeholder="Одно блюдо на строку" autocomplete="off" spellcheck="false"></textarea>
    <div id="suggestRu" class="suggest-box" hidden></div>
    <div id="review" class="review" hidden></div>
  </div>
  <div class="panel">
    <h1>Меню EN</h1>
    <textarea id="enText" placeholder="Заполняется из базы" readonly></textarea>
  </div>
</section>

<section class="panel">
  <h1>Предпросмотр</h1>
  <div class="preview-grid">
    <div id="previewRu" class="preview"></div>
    <div id="previewEn" class="preview"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/app.js' %}" defer></script>
{% endblock %}
