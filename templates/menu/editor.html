{% extends "base.html" %}
{% load static %}
{% block title %}Редактор базы{% endblock %}
{% block topbar_actions %}
<div class="page-actions">
  <button id="btnSave" class="primary" type="button">Сохранить</button>
  <label class="inline"><input id="onlyNew" type="checkbox" checked> Только новые блюда</label>
  <span id="status" class="muted"></span>
</div>
{% endblock %}
{% block content %}
<section class="grid-two editor-layout">
  <div class="panel">
    <h1>Новые блюда</h1>
    <p class="muted">Одно блюдо на строку.</p>
    <textarea id="newDishes" placeholder="Одно блюдо на строку"></textarea>
  </div>
  <div class="panel table-panel">
    <div class="editor-table-head">
      <h1>База</h1>
      <input id="searchRu" class="editor-search" type="search" placeholder="Поиск RU" autocomplete="off" hidden>
    </div>
    <table>
      <thead>
        <tr>
          <th><button class="table-sort" type="button" data-sort="ru">RU</button></th>
          <th><button class="table-sort" type="button" data-sort="en">EN</button></th>
          <th>kcal</th>
          <th>гр</th>
          <th><button class="table-sort" type="button" data-sort="catRu">Группа RU</button></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/editor.js' %}" defer></script>
{% endblock %}
