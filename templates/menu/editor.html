{% extends "base.html" %}
{% load static %}
{% block title %}Редактор базы{% endblock %}
{% block topbar_actions %}
<div class="page-actions">
  <input id="csvFile" type="file" accept=".csv">
  <button id="btnImport" type="button">Импорт CSV</button>
  <button id="btnReload" type="button">Загрузить базу</button>
  <button id="btnAddLines" type="button">Добавить строки</button>
  <button id="btnSave" class="primary" type="button">Сохранить</button>
  <label class="inline"><input id="onlyNew" type="checkbox" checked> Только новые блюда</label>
  <span id="status" class="muted"></span>
</div>
{% endblock %}
{% block content %}
<section class="grid-two editor-layout">
  <div class="panel">
    <h1>Новые блюда</h1>
    <p class="muted">Одно блюдо на строку.</p>
    <textarea id="newDishes" placeholder="Одно блюдо на строку"></textarea>
  </div>
  <div class="panel table-panel">
    <h1>База</h1>
    <table>
      <thead>
        <tr>
          <th>RU</th>
          <th>EN</th>
          <th>kcal</th>
          <th>гр</th>
          <th>Группа RU</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/editor.js' %}" defer></script>
{% endblock %}
