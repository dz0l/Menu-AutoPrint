{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>Смена пароля</h1>
  {% if error %}<p class="danger">{{ error }}</p>{% endif %}
  {% if errors %}
    {% for item in errors %}<p class="danger">{{ item }}</p>{% endfor %}
  {% endif %}
  <form method="post" class="stack auth-form">
    {% csrf_token %}
    <label class="stack form-field auth-field">
      <span>Новый пароль</span>
      <input name="new_password" type="password" autocomplete="new-password" required>
    </label>
    <label class="stack form-field auth-field">
      <span>Повторите новый пароль</span>
      <input name="new_password_repeat" type="password" autocomplete="new-password" required>
    </label>
    <button class="primary" type="submit">Сменить пароль</button>
  </form>
</section>
{% endblock %}
