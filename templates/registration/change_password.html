{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>Смена пароля</h1>
  {% if error %}<p class="danger">{{ error }}</p>{% endif %}
  {% if errors %}
    {% for item in errors %}<p class="danger">{{ item }}</p>{% endfor %}
  {% endif %}
  <form method="post" class="stack">
    {% csrf_token %}
    <label>Текущий пароль <input name="old_password" type="password" autocomplete="current-password" required></label>
    <label>Новый пароль <input name="new_password" type="password" autocomplete="new-password" required></label>
    <button class="primary" type="submit">Сменить пароль</button>
  </form>
</section>
{% endblock %}
