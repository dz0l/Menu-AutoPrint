{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Menu AutoPrint{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'menu:index' %}">Menu AutoPrint</a>
    <nav class="nav">
      <a href="{% url 'menu:editor' %}">Редактор</a>
      <a href="{% url 'dishes:export_csv' %}">CSV</a>
      {% if request.user.is_authenticated %}
        <span>{{ request.user.username }}</span>
        <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button type="submit">Выход</button></form>
      {% else %}
        <a href="{% url 'login' %}">Вход</a>
      {% endif %}
    </nav>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" hidden></div>
  {% block scripts %}{% endblock %}
</body>
</html>
